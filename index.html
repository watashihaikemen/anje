<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Answers Oracle - Ultimate Edition</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",sans-serif;
    background:
    radial-gradient(circle at top,#312e81 0%,#0f172a 45%,#020617 100%);
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
    radial-gradient(white 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.08;
    animation:stars 40s linear infinite;
}

@keyframes stars{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(40px);
    }
}

.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    font-size:42px;
    margin-top:10px;
    margin-bottom:25px;
    letter-spacing:2px;
    text-shadow:0 0 25px rgba(255,255,255,0.4);
}

.panel{
    background:rgba(15,23,42,0.75);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:24px;
    padding:25px;
    box-shadow:0 0 35px rgba(0,0,0,0.4);
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:15px;
    color:#cbd5e1;
}

textarea,
select,
button{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    font-size:16px;
}

textarea{
    resize:none;
    min-height:100px;
    background:#0f172a;
    color:white;
}

select{
    background:#0f172a;
    color:white;
}

button{
    cursor:pointer;
    font-weight:bold;
    transition:0.25s;
}

.mainBtn{
    margin-top:20px;
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    color:white;
}

.mainBtn:hover{
    transform:translateY(-2px) scale(1.01);
    box-shadow:0 0 25px rgba(139,92,246,0.5);
}

.secondaryBtn{
    margin-top:15px;
    background:#059669;
    color:white;
}

.secondaryBtn:hover{
    background:#047857;
}

.deleteBtn{
    margin-top:15px;
    background:#dc2626;
    color:white;
}

.deleteBtn:hover{
    background:#b91c1c;
}

.status{
    margin-top:15px;
    color:#cbd5e1;
    text-align:center;
}

.deck{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:14px;
    margin-top:30px;
}

.oracleCard{
    aspect-ratio:2/3;
    border-radius:18px;
    position:relative;
    transform-style:preserve-3d;
    transition:0.8s;
    cursor:pointer;
}

.oracleCard.flipped{
    transform:rotateY(180deg);
}

.cardFace{
    position:absolute;
    inset:0;
    border-radius:18px;
    backface-visibility:hidden;
    overflow:hidden;
}

.cardBack{
    background:
    linear-gradient(135deg,#8b5cf6,#312e81);
    border:2px solid rgba(255,255,255,0.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:
    0 0 25px rgba(139,92,246,0.4),
    inset 0 0 20px rgba(255,255,255,0.1);
}

.cardBack::before{
    content:"✦";
    font-size:42px;
    opacity:0.9;
}

.cardFront{
    background:#1e293b;
    transform:rotateY(180deg);
    padding:12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 20px rgba(255,255,255,0.08);
}

.cardTitle{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    color:#f8fafc;
}

.cardRole{
    font-size:13px;
    color:#cbd5e1;
    margin-bottom:12px;
}

.cardMeaning{
    font-size:13px;
    line-height:1.7;
    color:#d1d5db;
}

.selectedGlow{
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 0 rgba(255,255,255,0);
    }
    50%{
        box-shadow:0 0 30px rgba(255,255,255,0.35);
    }
    100%{
        box-shadow:0 0 0 rgba(255,255,255,0);
    }
}

.readingBox{
    margin-top:35px;
    background:rgba(15,23,42,0.85);
    border-radius:24px;
    padding:30px;
    line-height:2;
    border:1px solid rgba(255,255,255,0.08);
    display:none;
}

.readingBox h2{
    margin-top:0;
    margin-bottom:20px;
}

.history{
    margin-top:35px;
}

.historyItem{
    border-top:1px solid rgba(255,255,255,0.08);
    padding:20px 0;
}

.historyQuestion{
    color:#facc15;
    margin-bottom:12px;
}

.historyDate{
    color:#94a3b8;
    font-size:13px;
    margin-bottom:12px;
}

.tag{
    display:inline-block;
    background:#312e81;
    padding:8px 12px;
    border-radius:999px;
    margin:4px;
    font-size:13px;
}

.empty{
    color:#94a3b8;
}

.fadeIn{
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    h1{
        font-size:30px;
    }

    .deck{
        grid-template-columns:repeat(3,1fr);
    }

}

</style>
</head>

<body>

<div class="container">

<h1>👼 ANGEL ANSWERS ORACLE 👼</h1>

<div class="panel">

<label>質問を入力</label>

<textarea id="question" placeholder="例：あの人との恋愛は進展しますか？"></textarea>

<label>スプレッドを選択</label>

<select id="spreadType">

<option value="1">1枚引き</option>

<option value="3">3枚引き（過去 / 現在 / 未来）</option>

<option value="5">5枚引き（状況 / 障害 / 本音 / 行動 / 結果）</option>

<option value="7">7枚引き（総合深層リーディング）</option>

</select>

<button class="mainBtn" onclick="startOracle()">
シャッフルしてカードを並べる
</button>

<button class="secondaryBtn" onclick="saveReading()">
現在の結果を保存
</button>

<button class="deleteBtn" onclick="deleteHistory()">
保存履歴を全削除
</button>

<div class="status" id="status">
質問を心に浮かべてください…
</div>

</div>

<div class="deck" id="deck"></div>

<div class="readingBox fadeIn" id="readingBox"></div>

<div class="panel history">

<h2>保存履歴</h2>

<div id="historyContent">
<div class="empty">
まだ保存履歴はありません
</div>
</div>

</div>

</div>

<script>

const cardRoles = {

1:["メッセージ"],

3:["過去","現在","未来"],

5:["状況","障害","本音","行動","結果"],

7:["現状","潜在意識","相手","障害","行動","未来","最終結果"]

};

const angelCards = [

{
name:"YES",
meaning:"強い肯定。流れは前向きです。",
type:"positive"
},

{
name:"YES!",
meaning:"非常に強力なYES。迷わず進めます。",
type:"positive"
},

{
name:"NO",
meaning:"今は方向転換が必要かもしれません。",
type:"negative"
},

{
name:"NO!",
meaning:"警告。強引に進めると後悔しやすいです。",
type:"negative"
},

{
name:"WAIT",
meaning:"急がないことで運気が整います。",
type:"neutral"
},

{
name:"TRUST",
meaning:"直感を信じることが重要です。",
type:"positive"
},

{
name:"ROMANCE",
meaning:"恋愛面のエネルギーが活発です。",
type:"love"
},

{
name:"ABUNDANCE",
meaning:"豊かさや成功が近づいています。",
type:"positive"
},

{
name:"OPPORTUNITY",
meaning:"大きなチャンスが到来しています。",
type:"positive"
},

{
name:"TAKE ACTION",
meaning:"今こそ行動を起こすタイミングです。",
type:"action"
},

{
name:"COMPROMISE",
meaning:"歩み寄りが状況改善に繋がります。",
type:"neutral"
},

{
name:"COMMUNICATE CLEARLY",
meaning:"率直な会話が必要です。",
type:"neutral"
},

{
name:"BIG HAPPY CHANGES",
meaning:"人生が良い方向へ変わります。",
type:"positive"
},

{
name:"NOT THE RIGHT TIME",
meaning:"まだタイミングが整っていません。",
type:"neutral"
},

{
name:"CHOOSE A NEW DIRECTION",
meaning:"新しい道を選ぶ時です。",
type:"action"
},

{
name:"REMAIN POSITIVE",
meaning:"前向きな意識が未来を引き寄せます。",
type:"positive"
},

{
name:"LET GO",
meaning:"執着を手放すことで流れが変わります。",
type:"neutral"
},

{
name:"SUCCESS",
meaning:"努力が結果へ結びつきます。",
type:"positive"
},

{
name:"PEACEFUL RESOLUTION",
meaning:"穏やかな解決へ向かっています。",
type:"positive"
},

{
name:"HELPFUL PEOPLE",
meaning:"助けてくれる人物が現れます。",
type:"positive"
},

{
name:"PERFECT TIMING",
meaning:"今は最高のタイミングです。",
type:"positive"
},

{
name:"LISTEN TO YOUR INTUITION",
meaning:"理屈より直感が重要です。",
type:"positive"
},

{
name:"THERE'S SOMETHING BETTER",
meaning:"もっと良い選択肢があります。",
type:"neutral"
},

{
name:"GET MORE INFORMATION",
meaning:"まだ情報不足です。",
type:"neutral"
},

{
name:"IT'S UP TO YOU",
meaning:"決断権はあなた自身にあります。",
type:"action"
},

{
name:"SOON",
meaning:"近いうちに結果が現れます。",
type:"positive"
},

{
name:"UNLIKELY",
meaning:"現状では可能性は低めです。",
type:"negative"
},

{
name:"LOOK FOR A SIGN",
meaning:"重要なサインに気付いてください。",
type:"neutral"
},

{
name:"FORGIVENESS",
meaning:"許しが心を軽くします。",
type:"neutral"
},

{
name:"NO NEED TO WORRY",
meaning:"必要以上に不安にならなくて大丈夫です。",
type:"positive"
},

{
name:"YOU'RE READY",
meaning:"あなたは既に準備が整っています。",
type:"positive"
}

];

let currentReading = [];
let currentQuestion = "";

function secureRandom(max){

    const array = new Uint32Array(1);

    crypto.getRandomValues(array);

    return array[0] % max;

}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j = secureRandom(i+1);

        [array[i],array[j]] = [array[j],array[i]];

    }

}

function startOracle(){

    currentQuestion = document.getElementById("question").value.trim();

    if(currentQuestion === ""){

        alert("質問を入力してください");

        return;

    }

    const spread = parseInt(document.getElementById("spreadType").value);

    const deckDiv = document.getElementById("deck");

    const status = document.getElementById("status");

    const readingBox = document.getElementById("readingBox");

    readingBox.style.display = "none";

    deckDiv.innerHTML = "";

    status.innerHTML = "シャッフル中...";

    let deck = [...angelCards];

    shuffle(deck);

    const selected = deck.slice(0,spread);

    currentReading = [];

    setTimeout(()=>{

        status.innerHTML = "カードを選んでください";

        selected.forEach((card,index)=>{

            const div = document.createElement("div");

            div.className = "oracleCard";

            div.dataset.index = index;

            div.innerHTML = `

            <div class="cardFace cardBack"></div>

            <div class="cardFace cardFront">

                <div class="cardRole">
                    ${cardRoles[spread][index]}
                </div>

                <div class="cardTitle">
                    ${card.name}
                </div>

                <div class="cardMeaning">
                    ${card.meaning}
                </div>

            </div>

            `;

            div.addEventListener("click",()=>{

                if(div.classList.contains("flipped")) return;

                div.classList.add("flipped");
                div.classList.add("selectedGlow");

                currentReading.push({
                    role:cardRoles[spread][index],
                    card:card
                });

                if(currentReading.length === spread){

                    generateReading();

                }

            });

            deckDiv.appendChild(div);

        });

    },1000);

}

function generateReading(){

    const readingBox = document.getElementById("readingBox");

    let text = `
    <h2>🔮 リーディング結果 🔮</h2>
    <p><strong>質問：</strong>${currentQuestion}</p>
    `;

    currentReading.forEach(item=>{

        text += `
        <p>
        <strong>${item.role}</strong><br>
        ${item.card.name}<br>
        ${item.card.meaning}
        </p>
        `;

    });

    const names = currentReading.map(r=>r.card.name);

    text += `<hr style="border-color:#334155;">`;

    text += `<p><strong>総合メッセージ</strong><br>`;

    if(names.includes("YES!") || names.includes("SUCCESS")){

        text += `
        願いは現実へ向かって動いています。
        恐れより希望を優先した方が良い流れです。
        `;

    }

    if(names.includes("WAIT") || names.includes("NOT THE RIGHT TIME")){

        text += `
        ただし焦りは禁物です。
        タイミングを誤ると本来の流れを乱しやすくなります。
        `;

    }

    if(names.includes("ROMANCE")){

        text += `
        恋愛感情や人間関係のエネルギーはかなり強まっています。
        `;

    }

    if(names.includes("TAKE ACTION")){

        text += `
        あなた自身の行動が未来を大きく変える鍵になります。
        `;
    }

    if(names.includes("NO!") || names.includes("UNLIKELY")){

        text += `
        一部には警告も含まれています。
        無理に進めるより、一度立ち止まる視点も必要でしょう。
        `;

    }

    if(names.includes("TRUST") || names.includes("LISTEN TO YOUR INTUITION")){

        text += `
        最終的には理屈より直感が答えへ近づけてくれます。
        `;

    }

    text += `</p>`;

    readingBox.innerHTML = text;

    readingBox.style.display = "block";

    document.getElementById("status").innerHTML =
    "リーディングが完成しました";

}

function saveReading(){

    if(currentReading.length === 0){

        alert("まだ結果がありません");

        return;

    }

    const history = JSON.parse(localStorage.getItem("angelOracleUltimate")) || [];

    history.unshift({

        date:new Date().toLocaleString(),

        question:currentQuestion,

        cards:currentReading

    });

    localStorage.setItem(
        "angelOracleUltimate",
        JSON.stringify(history)
    );

    loadHistory();

    alert("保存しました");

}

function loadHistory(){

    const content = document.getElementById("historyContent");

    const history = JSON.parse(
        localStorage.getItem("angelOracleUltimate")
    ) || [];

    if(history.length === 0){

        content.innerHTML =
        `<div class="empty">まだ保存履歴はありません</div>`;

        return;

    }

    let html = "";

    history.forEach(item=>{

        html += `
        <div class="historyItem">

        <div class="historyDate">
        ${item.date}
        </div>

        <div class="historyQuestion">
        ❓ ${item.question}
        </div>

        `;

        item.cards.forEach(c=>{

            html += `
            <span class="tag">
            ${c.role} : ${c.card.name}
            </span>
            `;

        });

        html += `</div>`;

    });

    content.innerHTML = html;

}

function deleteHistory(){

    if(!confirm("本当に全履歴を削除しますか？")) return;

    localStorage.removeItem("angelOracleUltimate");

    loadHistory();

}

loadHistory();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エンジェルアンサーオラクル 完全版</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.controls{
    background:#1e293b;
    padding:20px;
    border-radius:16px;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

select,button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    cursor:pointer;
    margin-top:15px;
    transition:0.2s;
}

.drawBtn{
    background:#7c3aed;
    color:white;
}

.drawBtn:hover{
    background:#6d28d9;
}

.saveBtn{
    background:#059669;
    color:white;
}

.saveBtn:hover{
    background:#047857;
}

.deleteBtn{
    background:#dc2626;
    color:white;
}

.deleteBtn:hover{
    background:#b91c1c;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.card img{
    width:100%;
    border-radius:12px;
    margin-bottom:12px;
}

.card h3{
    margin:0 0 10px;
}

.meaning{
    color:#d1d5db;
    line-height:1.6;
    font-size:14px;
}

.readingBox{
    background:#1e293b;
    margin-top:30px;
    padding:20px;
    border-radius:16px;
    line-height:1.8;
}

.history{
    margin-top:40px;
    background:#1e293b;
    padding:20px;
    border-radius:16px;
}

.historyItem{
    border-bottom:1px solid #334155;
    padding:20px 0;
}

.emptyText{
    color:#94a3b8;
}

.date{
    color:#94a3b8;
    margin-bottom:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>👼 エンジェルアンサーオラクル 完全版 👼</h1>

<div class="controls">

<label>引く枚数</label>

<select id="cardCount">
<option value="1">1枚</option>
<option value="2">2枚</option>
<option value="3">3枚</option>
<option value="4">4枚</option>
<option value="5">5枚</option>
<option value="6">6枚</option>
<option value="7">7枚</option>
</select>

<button class="drawBtn" onclick="drawCards()">カードを引く</button>
<button class="saveBtn" onclick="saveResult()">結果を保存</button>
<button class="deleteBtn" onclick="deleteAllHistory()">保存結果を全削除</button>

</div>

<div class="cards" id="result"></div>

<div class="readingBox" id="readingBox" style="display:none;"></div>

<div class="history">
<h2>保存済み結果</h2>
<div id="historyContent">
<div class="emptyText">まだ保存された結果はありません。</div>
</div>
</div>

</div>

<script>

const angelCards = [

meaning:"必要以上に不安になる必要はありません。"
},

{
name:"YOU'RE READY",
meaning:"あなたは既に準備が整っています。"
},

{
name:"WEIGHT",
meaning:"重荷を抱え込みすぎています。少し力を抜いて。"

meaning:"心の平穏を優先するべき時です。"

const cardBack = "https://dummyimage.com/400x600/7c3aed/ffffff&text=Angel+Answers";

let currentResult = [];

function secureRandom(max){
    const array = new Uint32Array(1);
    crypto.getRandomValues(array);
    return array[0] % max;
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j = secureRandom(i+1);

        [array[i],array[j]] = [array[j],array[i]];

    }

}

function drawCards(){

    const count = parseInt(document.getElementById("cardCount").value);

    let deck = [...angelCards];

    shuffle(deck);

    const drawn = deck.slice(0,count);

    const resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "";

    currentResult = [];

    drawn.forEach((card,index)=>{

        const cardDiv = document.createElement("div");

        cardDiv.className = "card";

        cardDiv.innerHTML = `
            <img src="${cardBack}">
            <h3>${card.name}</h3>
            <div class="meaning">${card.meaning}</div>
        `;

        resultDiv.appendChild(cardDiv);

        currentResult.push(card);

    });

    generateReading();

}

function generateReading(){

    const readingBox = document.getElementById("readingBox");

    let text = "🔮 総合リーディング 🔮<br><br>";

    const names = currentResult.map(c=>c.name);

    if(names.includes("YES") || names.includes("YES!")){
        text += "全体的に願望成就の流れが強めです。 ";
    }

    if(names.includes("NO") || names.includes("NO!")){
        text += "ただし一部には慎重さを求める警告も含まれています。 ";
    }

    if(names.includes("ROMANCE")){
        text += "恋愛面では感情の動きが活発化しやすい時期。 ";
    }

    if(names.includes("ABUNDANCE")){
        text += "金運や仕事運にも良い流れがあります。 ";
    }

    if(names.includes("WAIT")){
        text += "急ぎすぎずタイミングを見ることも重要です。 ";
    }

    if(names.includes("TAKE ACTION")){
        text += "逆に、勇気を出して行動することで状況が動く暗示もあります。 ";
    }

    if(names.includes("TRUST")){
        text += "最終的にはあなた自身の直感を信じることが鍵になるでしょう。 ";
    }

    if(text === "🔮 総合リーディング 🔮<br><br>"){
        text += "今は流れが切り替わる途中段階にあります。焦らず状況を見守ってください。";
    }

    readingBox.innerHTML = text;

    readingBox.style.display = "block";

}

function saveResult(){

    if(currentResult.length === 0){
        alert("先にカードを引いてください");
        return;
    }

    const history = JSON.parse(localStorage.getItem("angelHistory")) || [];

    history.unshift({
        date:new Date().toLocaleString(),
        cards:currentResult
    });

    localStorage.setItem("angelHistory",JSON.stringify(history));

    loadHistory();

    alert("保存しました");

}

function loadHistory(){

    const historyContent = document.getElementById("historyContent");

    const history = JSON.parse(localStorage.getItem("angelHistory")) || [];

    if(history.length===0){
        historyContent.innerHTML = `<div class="emptyText">まだ保存された結果はありません。</div>`;
        return;
    }

    let html = "";

    history.forEach(item=>{

        html += `<div class="historyItem">`;

        html += `<div class="date">${item.date}</div>`;

        item.cards.forEach(card=>{

            html += `
            <div style="display:inline-block; width:220px; margin:10px; vertical-align:top;">
                <strong>${card.name}</strong>
                <p style="font-size:13px; color:#d1d5db; line-height:1.6;">
                    ${card.meaning}
                </p>
            </div>
            `;

        });

        html += `</div>`;

    });

    historyContent.innerHTML = html;

}

function deleteAllHistory(){

    if(!confirm("全削除しますか？")) return;

    localStorage.removeItem("angelHistory");

    loadHistory();

}

loadHistory();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANGEL ANSWERS ORACLE - MASTERPIECE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg1:#020617;
--bg2:#0f172a;
--bg3:#312e81;
--gold:#facc15;
--pink:#ec4899;
--red:#ef4444;
--green:#22c55e;
--blue:#60a5fa;
--violet:#8b5cf6;
--white:#f8fafc;
}

body{
font-family:"Segoe UI",sans-serif;
background:
radial-gradient(circle at top,#4338ca 0%,#0f172a 40%,#020617 100%);
min-height:100vh;
overflow-x:hidden;
color:white;
position:relative;
}

body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background-image:
radial-gradient(rgba(255,255,255,0.8) 1px, transparent 1px);
background-size:45px 45px;
opacity:0.12;
animation:starsMove 80s linear infinite;
}

body::after{
content:"";
position:fixed;
inset:-50%;
background:
radial-gradient(circle,rgba(139,92,246,0.2),transparent 60%),
radial-gradient(circle,rgba(96,165,250,0.15),transparent 65%),
radial-gradient(circle,rgba(236,72,153,0.12),transparent 70%);
filter:blur(120px);
animation:aurora 20s ease infinite alternate;
pointer-events:none;
}

@keyframes aurora{
0%{transform:translate(-5%,-5%) rotate(0deg);}
100%{transform:translate(5%,5%) rotate(15deg);}
}

@keyframes starsMove{
from{transform:translateY(0);}
to{transform:translateY(120px);}
}

.container{
max-width:1600px;
margin:auto;
padding:24px;
position:relative;
z-index:1;
}

.title{
text-align:center;
font-size:52px;
font-weight:900;
letter-spacing:3px;
margin-bottom:10px;
text-shadow:0 0 30px rgba(255,255,255,0.4);
}

.subtitle{
text-align:center;
color:#cbd5e1;
margin-bottom:35px;
font-size:15px;
letter-spacing:2px;
}

.panel{
background:rgba(15,23,42,0.72);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
border-radius:28px;
padding:28px;
box-shadow:
0 0 40px rgba(0,0,0,0.4),
inset 0 0 40px rgba(255,255,255,0.02);
margin-bottom:28px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

label{
display:block;
margin-bottom:10px;
margin-top:18px;
color:#e2e8f0;
font-size:14px;
letter-spacing:1px;
}

textarea,
select,
button{
width:100%;
border:none;
border-radius:18px;
padding:16px;
font-size:16px;
}

textarea,
select{
background:#020617;
color:white;
}

textarea{
min-height:110px;
resize:none;
}

button{
font-weight:700;
cursor:pointer;
transition:0.35s;
}

.mainBtn{
background:linear-gradient(135deg,#8b5cf6,#6366f1);
color:white;
margin-top:20px;
}

.mainBtn:hover{
transform:translateY(-3px) scale(1.01);
box-shadow:0 0 30px rgba(139,92,246,0.55);
}

.secondaryBtn{
background:#059669;
color:white;
margin-top:15px;
}

.secondaryBtn:hover{
background:#047857;
}

.deleteBtn{
background:#dc2626;
color:white;
margin-top:15px;
}

.deleteBtn:hover{
background:#b91c1c;
}

.status{
margin-top:20px;
text-align:center;
color:#cbd5e1;
font-size:15px;
}

.deckArea{
perspective:1400px;
}

.deck{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:18px;
margin-top:25px;
}

.oracleCard{
position:relative;
aspect-ratio:2/3;
transform-style:preserve-3d;
transition:1s;
cursor:pointer;
}

.oracleCard:hover{
transform:translateY(-8px) rotateZ(-1deg);
}

.oracleCard.flipped{
transform:rotateY(180deg);
}

.face{
position:absolute;
inset:0;
border-radius:22px;
overflow:hidden;
backface-visibility:hidden;
}

.back{
background:
linear-gradient(135deg,#4338ca,#1e1b4b);
border:2px solid rgba(255,255,255,0.15);
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
box-shadow:
0 0 35px rgba(139,92,246,0.35),
inset 0 0 25px rgba(255,255,255,0.08);
}

.back::before{
content:"✦";
animation:float 3s ease infinite;
}

.front{
transform:rotateY(180deg);
padding:16px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:rgba(15,23,42,0.95);
border:1px solid rgba(255,255,255,0.08);
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0px);}
}

.role{
font-size:13px;
color:#cbd5e1;
margin-bottom:14px;
letter-spacing:1px;
}

.cardTitle{
font-size:20px;
font-weight:800;
margin-bottom:14px;
}

.cardMeaning{
font-size:13px;
line-height:1.8;
color:#d1d5db;
}

.positive .cardTitle{
color:var(--gold);
}

.negative .cardTitle{
color:#f87171;
}

.love .cardTitle{
color:#f472b6;
}

.action .cardTitle{
color:#fb923c;
}

.spiritual .cardTitle{
color:#93c5fd;
}

.glow{
animation:glowPulse 2s infinite;
}

@keyframes glowPulse{
0%{box-shadow:0 0 0 rgba(255,255,255,0);}
50%{box-shadow:0 0 35px rgba(255,255,255,0.35);}
100%{box-shadow:0 0 0 rgba(255,255,255,0);}
}

.readingBox{
display:none;
margin-top:35px;
padding:35px;
line-height:2.1;
border-radius:28px;
background:rgba(15,23,42,0.82);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,0.08);
}

.readingBox h2{
margin-bottom:22px;
font-size:34px;
}

.readingText{
color:#e2e8f0;
font-size:16px;
}

.tags{
margin-top:18px;
}

.tag{
display:inline-block;
padding:8px 14px;
border-radius:999px;
background:#312e81;
margin:4px;
font-size:13px;
}

.historyItem{
padding:20px 0;
border-top:1px solid rgba(255,255,255,0.08);
}

.historyQuestion{
color:#facc15;
margin-bottom:10px;
}

.historyDate{
color:#94a3b8;
font-size:13px;
margin-bottom:12px;
}

.empty{
color:#94a3b8;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

.title{
font-size:36px;
}

.deck{
grid-template-columns:repeat(2,1fr);
}

.readingBox{
padding:22px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="title">👼 ANGEL ANSWERS ORACLE 👼</div>
<div class="subtitle">MASTERPIECE EDITION</div>

<div class="panel">

<div class="grid">

<div>
<label>質問</label>
<textarea id="question" placeholder="例：あの人の気持ちは？進展はありますか？"></textarea>
</div>

<div>
<label>テーマ</label>
<select id="theme">
<option value="love">恋愛</option>
<option value="work">仕事</option>
<option value="future">未来</option>
<option value="relationship">人間関係</option>
<option value="spiritual">スピリチュアル</option>
</select>

<label>スプレッド</label>
<select id="spreadType">
<option value="1">1枚引き</option>
<option value="3">3枚引き</option>
<option value="5">5枚引き</option>
<option value="7">7枚深層リーディング</option>
</select>
</div>

</div>

<button class="mainBtn" onclick="startOracle()">
シャッフルして神託を受ける
</button>

<button class="secondaryBtn" onclick="saveReading()">
現在の結果を保存
</button>

<button class="deleteBtn" onclick="deleteHistory()">
保存履歴を削除
</button>

<div class="status" id="status">
心を静かにして質問を念じてください
</div>

</div>

<div class="deckArea">
<div class="deck" id="deck"></div>
</div>

<div class="readingBox" id="readingBox"></div>

<div class="panel">
<h2>保存履歴</h2>
<div id="historyContent">
<div class="empty">保存履歴はありません</div>
</div>
</div>

</div>

<script>

const cardRoles={
1:["神託"],
3:["過去","現在","未来"],
5:["現状","障害","本音","行動","結果"],
7:["現状","潜在意識","相手","障害","行動","近未来","最終結果"]
};

const angelCards=[
{name:"YES",meaning:"強い肯定。流れは前向きです。",type:"positive"},
{name:"YES!",meaning:"非常に強力なYES。迷わず進むべきです。",type:"positive"},
{name:"NO",meaning:"今は進まない方が良い可能性があります。",type:"negative"},
{name:"NO!",meaning:"警告。無理に進めると後悔しやすいです。",type:"negative"},
{name:"WAIT",meaning:"焦らず時を待つ必要があります。",type:"neutral"},
{name:"TRUST",meaning:"あなたの直感を信じるべきです。",type:"spiritual"},
{name:"ROMANCE",meaning:"恋愛のエネルギーが高まっています。",type:"love"},
{name:"ABUNDANCE",meaning:"豊かさと成功が近づいています。",type:"positive"},
{name:"OPPORTUNITY",meaning:"大きなチャンスが訪れます。",type:"positive"},
{name:"TAKE ACTION",meaning:"今こそ動くタイミングです。",type:"action"},
{name:"COMMUNICATE CLEARLY",meaning:"本音を伝える必要があります。",type:"neutral"},
{name:"BIG HAPPY CHANGES",meaning:"人生が大きく好転します。",type:"positive"},
{name:"NOT THE RIGHT TIME",meaning:"まだタイミングが整っていません。",type:"neutral"},
{name:"CHOOSE A NEW DIRECTION",meaning:"新しい道を選ぶ時です。",type:"action"},
{name:"REMAIN POSITIVE",meaning:"前向きさが未来を引き寄せます。",type:"positive"},
{name:"LET GO",meaning:"執着を手放す必要があります。",type:"neutral"},
{name:"SUCCESS",meaning:"努力が実を結びます。",type:"positive"},
{name:"PEACEFUL RESOLUTION",meaning:"穏やかな解決へ向かっています。",type:"positive"},
{name:"HELPFUL PEOPLE",meaning:"助けてくれる人物が現れます。",type:"positive"},
{name:"PERFECT TIMING",meaning:"今は最高のタイミングです。",type:"positive"},
{name:"LISTEN TO YOUR INTUITION",meaning:"理屈より直感を優先してください。",type:"spiritual"},
{name:"THERE'S SOMETHING BETTER",meaning:"もっと良い選択肢があります。",type:"neutral"},
{name:"GET MORE INFORMATION",meaning:"まだ情報不足です。",type:"neutral"},
{name:"IT'S UP TO YOU",meaning:"未来はあなたの選択次第です。",type:"action"},
{name:"SOON",meaning:"近いうちに動きがあります。",type:"positive"},
{name:"UNLIKELY",meaning:"現状では可能性は低めです。",type:"negative"},
{name:"LOOK FOR A SIGN",meaning:"重要なサインに気付いてください。",type:"spiritual"},
{name:"FORGIVENESS",meaning:"許しが流れを変えます。",type:"neutral"},
{name:"NO NEED TO WORRY",meaning:"過度な不安は必要ありません。",type:"positive"},
{name:"YOU'RE READY",meaning:"準備は整っています。",type:"positive"},
{name:"ASK YOUR ANGELS",meaning:"高次の導きを求めてください。",type:"spiritual"},
{name:"BE ASSERTIVE",meaning:"遠慮せず意思を示してください。",type:"action"},
{name:"IMPROVING HEALTH",meaning:"心身の状態は改善へ向かいます。",type:"positive"},
{name:"MEDITATION BRINGS ANSWERS",meaning:"静かな時間が答えを運びます。",type:"spiritual"},
{name:"RECOVERY",meaning:"状況は回復へ向かっています。",type:"positive"},
{name:"RECONSIDER",meaning:"もう一度考え直す必要があります。",type:"neutral"},
{name:"WITHIN THE NEXT FEW WEEKS",meaning:"数週間以内に動きがあります。",type:"positive"},
{name:"WITHIN THE NEXT FEW MONTHS",meaning:"数ヶ月以内に形になり始めます。",type:"positive"},
{name:"IN THE NEAR FUTURE",meaning:"近未来に大きな変化があります。",type:"positive"},
{name:"ASK FOR HELP FROM OTHERS",meaning:"一人で抱え込まないでください。",type:"positive"},
{name:"IF YOU BELIEVE",meaning:"信じる力が未来を変えます。",type:"spiritual"},
{name:"MEDITATION",meaning:"心を整える必要があります。",type:"spiritual"},
{name:"DIVINE TIMING",meaning:"宇宙のタイミングが動いています。",type:"spiritual"},
{name:"SPIRITUAL GROWTH",meaning:"魂の成長段階に入っています。",type:"spiritual"}
];

let currentReading=[];
let currentQuestion="";

function secureRandom(max){
const array=new Uint32Array(1);
crypto.getRandomValues(array);
return array[0]%max;
}

function shuffle(array){
for(let i=array.length-1;i>0;i--){
const j=secureRandom(i+1);
[array[i],array[j]]=[array[j],array[i]];
}
}

function startOracle(){

currentQuestion=document.getElementById("question").value.trim();

if(currentQuestion===""){
alert("質問を入力してください");
return;
}

const spread=parseInt(document.getElementById("spreadType").value);
const deckDiv=document.getElementById("deck");
const readingBox=document.getElementById("readingBox");
const status=document.getElementById("status");

readingBox.style.display="none";
deckDiv.innerHTML="";
currentReading=[];

status.innerHTML="天使達がカードをシャッフルしています…";

let deck=[...angelCards];
shuffle(deck);

const selected=deck.slice(0,spread);

setTimeout(()=>{

status.innerHTML="カードを開いてください";

selected.forEach((card,index)=>{

const div=document.createElement("div");
div.className="oracleCard";

const typeClass=card.type || "neutral";

div.innerHTML=`
<div class="face back"></div>
<div class="face front ${typeClass}">
<div class="role">${cardRoles[spread][index]}</div>
<div class="cardTitle">${card.name}</div>
<div class="cardMeaning">${card.meaning}</div>
</div>
`;

setTimeout(()=>{
div.style.opacity=1;
},index*120);

let opened=false;

div.addEventListener("click",()=>{

if(opened) return;
opened=true;

div.classList.add("flipped");
div.classList.add("glow");

currentReading.push({
role:cardRoles[spread][index],
card:card
});

if(currentReading.length===spread){
setTimeout(generateReading,1200);
}

});

deckDiv.appendChild(div);

});

},1600);

}

function generateReading(){

const readingBox=document.getElementById("readingBox");

const names=currentReading.map(r=>r.card.name);

let text=`
<h2>🔮 リーディング結果 🔮</h2>
<div class="readingText">
<p><strong>質問：</strong>${currentQuestion}</p>
`;

currentReading.forEach(item=>{
text+=`
<p>
<strong>${item.role}</strong><br>
${item.card.name}<br>
${item.card.meaning}
</p>
`;
});

text+=`<hr style="border-color:#334155;margin:24px 0;">`;
text+=`<h3>総合神託</h3><p>`;

if(names.includes("YES!")||names.includes("SUCCESS")){
text+=`願いは強く現実化へ向かっています。流れ自体はかなり良好です。 `;
}

if(names.includes("WAIT")||names.includes("NOT THE RIGHT TIME")){
text+=`ただし焦りは禁物です。今は準備期間の意味も強いでしょう。 `;
}

if(names.includes("ROMANCE")){
text+=`恋愛面のエネルギーはかなり強く出ています。感情の動きが加速しそうです。 `;
}

if(names.includes("NO!")||names.includes("UNLIKELY")){
text+=`一部には強い警告も含まれています。無理押しは逆効果になりやすいです。 `;
}

if(names.includes("TRUST")||names.includes("LISTEN TO YOUR INTUITION")){
text+=`最終的な鍵は直感です。理屈より感覚の方が正解へ近づきます。 `;
}

if(names.includes("TAKE ACTION")||names.includes("BE ASSERTIVE")){
text+=`受け身では流れは変わりません。あなた自身の行動が未来を動かします。 `;
}

if(names.includes("LET GO")&&names.includes("THERE'S SOMETHING BETTER")){
text+=`執着を手放すことで、もっと良い未来へ進める暗示があります。 `;
}

if(names.includes("ROMANCE")&&names.includes("SOON")){
text+=`恋愛面では比較的近いうちに進展がありそうです。 `;
}

if(names.includes("MEDITATION BRINGS ANSWERS")||names.includes("MEDITATION")){
text+=`今は静けさの中に答えがあります。無理に動くより心を整える方が重要です。 `;
}

text+=`</p>`;

text+=`<div class="tags">`;

currentReading.forEach(r=>{
text+=`<span class="tag">${r.role} : ${r.card.name}</span>`;
});

text+=`</div></div>`;

readingBox.innerHTML=text;
readingBox.style.display="block";

document.getElementById("status").innerHTML=
"神託が降りました";

window.scrollTo({
top:readingBox.offsetTop-40,
behavior:"smooth"
});

}

function saveReading(){

if(currentReading.length===0){
alert("まだ結果がありません");
return;
}

const history=JSON.parse(localStorage.getItem("angelOracleMaster"))||[];

history.unshift({
date:new Date().toLocaleString(),
question:currentQuestion,
cards:currentReading
});

localStorage.setItem(
"angelOracleMaster",
JSON.stringify(history)
);

loadHistory();

alert("保存しました");

}

function loadHistory(){

const history=JSON.parse(localStorage.getItem("angelOracleMaster"))||[];

const content=document.getElementById("historyContent");

if(history.length===0){
content.innerHTML='<div class="empty">保存履歴はありません</div>';
return;
}

let html="";

history.forEach(item=>{

html+=`
<div class="historyItem">
<div class="historyDate">${item.date}</div>
<div class="historyQuestion">❓ ${item.question}</div>
`;

item.cards.forEach(card=>{
html+=`
<span class="tag">${card.role} : ${card.card.name}</span>
`;
});

html+=`</div>`;

});

content.innerHTML=html;

}

function deleteHistory(){

if(!confirm("履歴を全削除しますか？")) return;

localStorage.removeItem("angelOracleMaster");

loadHistory();

}

loadHistory();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Answers Oracle - Full 44 Deck</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:
    radial-gradient(circle at top,#1e293b,#020617);
    color:white;
    font-family:sans-serif;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:38px;
    margin-bottom:10px;
    color:#fde68a;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.controls{
    background:rgba(15,23,42,0.85);
    border:1px solid rgba(255,255,255,0.08);
    padding:25px;
    border-radius:22px;
    margin-bottom:30px;
    backdrop-filter:blur(8px);
}

label{
    display:block;
    margin-top:16px;
    margin-bottom:8px;
    color:#f8fafc;
}

select,
button{
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:16px;
}

button{
    cursor:pointer;
    transition:0.25s;
    min-height:52px;
    font-weight:bold;
}

.drawBtn{
    background:#7c3aed;
    color:white;
    margin-top:18px;
}

.drawBtn:hover{
    background:#6d28d9;
    transform:translateY(-2px);
}

.saveBtn{
    background:#059669;
    color:white;
    margin-top:12px;
}

.saveBtn:hover{
    background:#047857;
}

.deleteBtn{
    background:#dc2626;
    color:white;
    margin-top:12px;
}

.deleteBtn:hover{
    background:#b91c1c;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:24px;
}

.card{
    perspective:1000px;
}

.cardInner{
    position:relative;
    width:100%;
    transform-style:preserve-3d;
    animation:flip 0.8s ease forwards;
}

.cardFront{
    background:
    linear-gradient(145deg,#1e293b,#0f172a);
    border-radius:22px;
    padding:18px;
    box-shadow:
    0 0 20px rgba(0,0,0,0.35),
    0 0 25px rgba(250,204,21,0.08);
    border:1px solid rgba(255,255,255,0.05);
    overflow:hidden;
}

.cardImage{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    border-radius:16px;
    margin-bottom:16px;
}

.cardTitle{
    text-align:center;
    color:#fde68a;
    font-size:24px;
    margin-bottom:12px;
    font-weight:bold;
}

.cardCategory{
    display:inline-block;
    background:#7c3aed;
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    margin-bottom:12px;
}

.cardMessage{
    color:#e2e8f0;
    line-height:1.8;
    font-size:15px;
}

.history{
    margin-top:50px;
    background:rgba(15,23,42,0.85);
    padding:25px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,0.08);
}

.history h2{
    margin-top:0;
}

.historyItem{
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:25px 0;
}

.historyItem:last-child{
    border-bottom:none;
}

.savedGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
}

.savedCard{
    background:#111827;
    border-radius:16px;
    padding:12px;
    text-align:center;
}

.savedCard img{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:10px;
}

.savedTitle{
    color:#fde68a;
    font-size:14px;
    margin-bottom:8px;
    font-weight:bold;
}

.savedMessage{
    color:#cbd5e1;
    font-size:13px;
    line-height:1.5;
}

.date{
    color:#94a3b8;
    margin-bottom:16px;
}

.deleteSingleBtn{
    background:#ef4444;
    color:white;
    margin-top:20px;
}

.emptyText{
    color:#94a3b8;
}

@keyframes flip{
    from{
        transform:rotateY(90deg) scale(0.9);
        opacity:0;
    }
    to{
        transform:rotateY(0deg) scale(1);
        opacity:1;
    }
}

@media(max-width:700px){

    h1{
        font-size:28px;
    }

}

</style>
</head>

function generateImage(seed){

    return `https://picsum.photos/400/600?random=${seed}`;

}

oracleCards.forEach((card,index)=>{

    card.image = generateImage(index + 1);

});

let currentResult = [];

function secureRandom(max){

    const array = new Uint32Array(1);

    crypto.getRandomValues(array);

    return (array[0] / 4294967296) * max;

}

function shuffle(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(secureRandom(i + 1));

        [array[i],array[j]] = [array[j],array[i]];

    }

    return array;

}

function drawCards(){

    const count = parseInt(
        document.getElementById("cardCount").value
    );

    const deck = shuffle([...oracleCards]);

    const selected = deck.slice(0,count);

    const resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "";

    currentResult = [];

    selected.forEach((card,index)=>{

        const cardElement = document.createElement("div");

        cardElement.className = "card";

        cardElement.style.animationDelay = `${index * 0.08}s`;

        cardElement.innerHTML = `

        <div class="cardInner">

            <div class="cardFront">

                <img
                    class="cardImage"
                    src="${card.image}"
                    alt="${card.name}"
                    onerror="this.src='https://picsum.photos/400/600'"
                >

                <div class="cardTitle">
                    ${card.name}
                </div>

                <div class="cardCategory">
                    ${card.category}
                </div>

                <div class="cardMessage">
                    ${card.message}
                </div>

            </div>

        </div>

        `;

        resultDiv.appendChild(cardElement);

        currentResult.push(card);

    });

}

function saveResult(){

    if(currentResult.length === 0){

        alert("先にカードを引いてください");

        return;

    }

    const history = JSON.parse(
        localStorage.getItem("oracleHistory")
    ) || [];

    history.unshift({

        date:new Date().toLocaleString("ja-JP"),

        cards:currentResult

    });

    localStorage.setItem(
        "oracleHistory",
        JSON.stringify(history)
    );

    loadHistory();

    alert("結果を保存しました");

}

function loadHistory(){

    const historyContent =
    document.getElementById("historyContent");

    const history = JSON.parse(
        localStorage.getItem("oracleHistory")
    ) || [];

    if(history.length === 0){

        historyContent.innerHTML = `
        <div class="emptyText">
        まだ保存された結果はありません。
        </div>
        `;

        return;

    }

    let html = "";

    history.forEach((item,index)=>{

        html += `
        <div class="historyItem">

        <div class="date">
        ${item.date}
        </div>

        <div class="savedGrid">
        `;

        item.cards.forEach(card=>{

            html += `

            <div class="savedCard">

            <img
                src="${card.image}"
                alt="${card.name}"
            >

            <div class="savedTitle">
            ${card.name}
            </div>

            <div class="savedMessage">
            ${card.message}
            </div>

            </div>

            `;

        });

        html += `
        </div>

        <button
        class="deleteSingleBtn"
        onclick="deleteSingleHistory(${index})"
        >
        この結果を削除
        </button>

        </div>
        `;

    });

    historyContent.innerHTML = html;

}

function deleteSingleHistory(index){

    if(!confirm("この結果を削除しますか？")) return;

    const history = JSON.parse(
        localStorage.getItem("oracleHistory")
    ) || [];

    history.splice(index,1);

    localStorage.setItem(
        "oracleHistory",
        JSON.stringify(history)
    );

    loadHistory();

}

function deleteAllHistory(){

    if(!confirm("保存結果を全削除しますか？")) return;

    localStorage.removeItem("oracleHistory");

    loadHistory();

    alert("全削除しました");

}

loadHistory();

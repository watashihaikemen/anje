<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エンジェルアンサーオラクルカード Full Deck</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#111827;
    color:white;
    font-family:sans-serif;
}
.container{
    max-width:1200px;
    margin:auto;
}
h1{
    text-align:center;
    margin-bottom:25px;
}
.controls{
    background:#1f2937;
    padding:20px;
    border-radius:16px;
    margin-bottom:25px;
}
label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}
select, button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
}
button{
    cursor:pointer;
    margin-top:15px;
    transition:0.2s;
}
.drawBtn{
    background:#7c3aed;
    color:white;
}
.drawBtn:hover{
    background:#6d28d9;
}
.saveBtn{
    background:#059669;
    color:white;
}
.saveBtn:hover{
    background:#047857;
}
.deleteBtn{
    background:#dc2626;
    color:white;
}
.deleteBtn:hover{
    background:#b91c1c;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:20px;
}
.card{
    background:#1f2937;
    padding:15px;
    border-radius:16px;
    text-align:center;
}
.card img{
    width:100%;
    border-radius:12px;
    margin-bottom:12px;
}
.history{
    margin-top:40px;
    background:#1f2937;
    padding:20px;
    border-radius:16px;
}
.historyItem{
    border-bottom:1px solid #374151;
    padding:20px 0;
}
.historyItem:last-child{
    border-bottom:none;
}
.date{
    color:#9ca3af;
    margin-bottom:10px;
    font-size:14px;
}
.deleteSingleBtn{
    background:#ef4444;
    color:white;
    margin-top:15px;
}
.deleteSingleBtn:hover{
    background:#dc2626;
}
.emptyText{
    color:#9ca3af;
}
</style>
</head>

<body>
<div class="container">

<h1>🔮 エンジェルアンサーオラクルカード 🔮</h1>

<div class="controls">
    <label>引く枚数 (1〜10)</label>
    <select id="cardCount">
        <option value="1">1枚</option>
        <option value="2">2枚</option>
        <option value="3">3枚</option>
        <option value="4">4枚</option>
        <option value="5">5枚</option>
        <option value="6">6枚</option>
        <option value="7">7枚</option>
        <option value="8">8枚</option>
        <option value="9">9枚</option>
        <option value="10">10枚</option>
    </select>

    <button class="drawBtn" onclick="drawOracle()">カードを引く</button>
    <button class="saveBtn" onclick="saveResult()">結果を保存</button>
    <button class="deleteBtn" onclick="deleteAllHistory()">保存結果を全削除</button>
</div>

<div class="cards" id="result"></div>

<div class="history">
    <h2>保存済み結果</h2>
    <div id="historyContent">
        <div class="emptyText">まだ保存された結果はありません。</div>
    </div>
</div>

</div>

<script>
const oracleCards = [
    "Yes","Yes!","No","No!",
    "Ask Your Angels","Ask a Friend","Be Patient","Choose a New Direction",
    "Communicate Clearly","Compromise","Consider the Timing",
    "Don’t Stop","Get More Information","Improving Health",
    "It Is Up to You","Let Go","Look for a Sign","Meditation Brings Answers",
    "No Need to Worry","Not the Right Time","Opportunity",
    "Peaceful Resolution","Perfect Timing","Reconsider",
    "Remain Positive","Romance","Something Better",
    "Success","Take Action","There’s Something Better",
    "Trust","Wait","Within the Next Few Months",
    "Within the Next Few Weeks","Within the Next Year",
    "Yes, Definitely","You’ll Know","Helpful People",
    "Abundance","Big Happy Changes","Unlikely",
    "Trust Your Intuition","Recovery"
];

// プレースホルダー画像生成
function cardImage(text){
    return "https://via.placeholder.com/300x420/1f2937/ffffff?text=" + encodeURIComponent(text);
}

let currentResult = [];

function secureRandom(max){
    const array = new Uint32Array(1);
    crypto.getRandomValues(array);
    return array[0] % max;
}

function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
        const j = secureRandom(i + 1);
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function drawOracle(){
    const count = parseInt(document.getElementById("cardCount").value);
    let deck = [...oracleCards];
    shuffle(deck);

    const drawn = deck.slice(0, count);
    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "";
    currentResult = [];

    drawn.forEach(name=>{
        const cardDiv = document.createElement("div");
        cardDiv.className = "card";
        cardDiv.innerHTML = `
            <img src="${cardImage(name)}">
            <h3>${name}</h3>
        `;
        resultDiv.appendChild(cardDiv);

        currentResult.push({name, image: cardImage(name)});
    });
}

function saveResult(){
    if(currentResult.length === 0){
        alert("先にカードを引いてください");
        return;
    }
    const history = JSON.parse(localStorage.getItem("oracleHistory")) || [];
    history.unshift({
        date: new Date().toLocaleString(),
        cards: currentResult
    });
    localStorage.setItem("oracleHistory", JSON.stringify(history));
    loadHistory();
    alert("結果を保存しました");
}

function loadHistory(){
    const historyContent = document.getElementById("historyContent");
    const history = JSON.parse(localStorage.getItem("oracleHistory")) || [];

    if(history.length === 0){
        historyContent.innerHTML = `<div class="emptyText">まだ保存された結果はありません。</div>`;
        return;
    }

    let html = "";
    history.forEach((item,index)=>{
        html += `<div class="historyItem"><div class="date">${item.date}</div>`;
        item.cards.forEach(card=>{
            html += `
            <div style="display:inline-block;width:120px;text-align:center;margin:10px;">
                <img src="${card.image}" width="120" style="border-radius:10px;">
                <div style="font-size:13px;margin-top:6px;">${card.name}</div>
            </div>`;
        });
        html += `<br><button class="deleteSingleBtn" onclick="deleteSingleHistory(${index})">この結果を削除</button></div>`;
    });
    historyContent.innerHTML = html;
}

function deleteSingleHistory(index){
    if(!confirm("この結果を削除しますか？")) return;
    const history = JSON.parse(localStorage.getItem("oracleHistory")) || [];
    history.splice(index,1);
    localStorage.setItem("oracleHistory", JSON.stringify(history));
    loadHistory();
}

function deleteAllHistory(){
    if(!confirm("保存された結果を全削除しますか？")) return;
    localStorage.removeItem("oracleHistory");
    loadHistory();
    alert("全削除しました");
}

loadHistory();
</script>

</body>
</html>
